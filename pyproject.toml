[project]
name = "concurrent-patterns"
version = "0.1.0"
description = "Comprehensive collection of concurrency patterns and solutions for multicore programming"
requires-python = ">=3.11"
dependencies = [
    "asyncio",
    "aiohttp>=3.9.0",
    "uvloop>=0.19.0",
    "trio>=0.24.0",
    "anyio>=4.2.0",
    "concurrent-futures>=3.1.1",
    "multiprocessing-logging>=0.3.4",
    "psutil>=5.9.0",
    "numpy>=1.26.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
